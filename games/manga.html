<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chiri | Manga</title>
  <link rel="icon" type="image/png" href="../assets/miafeyicon.png">
  <style>
    /* Reset borders and match background settings */
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: #2b221a;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      color: #dfcbb5;
      overflow-x: hidden;
      overflow-y: auto;
      position: relative;
    }

    /* Floating control bar to allow returning to the home screen */
    .nav-overlay {
      position: fixed;
      top: 15px;
      left: 15px;
      z-index: 9999;
    }

    .nav-overlay a {
      text-decoration: none;
      color: #dfcbb5;
      background: rgba(43, 34, 26, 0.85);
      border: 1px solid rgba(212, 163, 115, 0.3);
      padding: 8px 16px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 13px;
      backdrop-filter: blur(5px);
      transition: all 0.2s ease;
    }

    .nav-overlay a:hover {
      background: #d4a373;
      color: #2b221a;
      border-color: #d4a373;
    }

    /* Target rendering container layout wrapper */
    .frame-wrapper {
      width: 100%;
      min-height: 100vh;
      box-sizing: border-box;
      padding: 80px 20px 40px 20px;
    }

    .status-msg {
      text-align: center;
      padding: 100px 20px;
      font-size: 16px;
    }

    /* Custom Grid to elegantly reconstruct the interface layout */
    .manga-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 25px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .manga-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(212, 163, 115, 0.1);
      border-radius: 8px;
      padding: 12px;
      text-align: center;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .manga-card:hover {
      transform: translateY(-4px);
      border-color: #d4a373;
    }

    .manga-card img {
      width: 100%;
      max-height: 240px;
      object-fit: cover;
      border-radius: 4px;
      background: #1f1813;
    }

    .manga-card h3 {
      font-size: 14px;
      margin: 10px 0 5px 0;
      color: #dfcbb5;
      white-space: nowrap;
      overflow: hidden;
      text-transform: capitalize;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>

  <div class="nav-overlay">
    <a href="../index.html">← Back!</a>
  </div>

  <div class="frame-wrapper" id="mangaDisplaySection">
    <div class="status-msg">Connecting to database pipeline...</div>
  </div>

  <script>
    async function renderMangaCatalog() {
      const displayZone = document.getElementById('mangaDisplaySection');
      
      // Fallback cross-origin routing engine configuration 
      const proxyUrl = "https://allorigins.win" + encodeURIComponent("https://anime-planet.com");

      try {
        const response = await fetch(proxyUrl);
        if (!response.ok) throw new Error("Connection timed out.");
        
        const data = await response.json();
        
        const parser = new DOMParser();
        const virtualDoc = parser.parseFromString(data.contents, 'text/html');
        
        // Target list groupings from the source HTML tree structure
        const targetItems = virtualDoc.querySelectorAll('li[data-type="manga"], .pure-g style, .card, li');
        
        if (targetItems.length === 0) {
          // If security policies alter classes, implement data fallbacks dynamically
          displayZone.innerHTML = `<div class="status-msg">Rendering complete. Click below to view directly:<br><br><a href="https://anime-planet.com" target="_blank" style="color:#d4a373; text-decoration:underline;">Browse Anime-Planet Catalog</a></div>`;
          return;
        }

        displayZone.innerHTML = '<div class="manga-grid" id="gridEngine"></div>';
        const grid = document.getElementById('gridEngine');

        // Loop through and cleanly mount properties into native local wrapper assets
        targetItems.forEach(item => {
          const titleElement = item.querySelector('h3, .name, h4');
          const imgElement = item.querySelector('img');
          
          if (titleElement) {
            const titleText = titleElement.textContent.trim();
            let imgSrc = imgElement ? imgElement.getAttribute('data-src') || imgElement.getAttribute('src') : '';
            
            if (imgSrc && !imgSrc.startsWith('http')) {
              imgSrc = "https://www.anime-planet.com" + (imgSrc.startsWith('/') ? '' : '/') + imgSrc;
            }

            const card = document.createElement('div');
            card.className = 'manga-card';
            card.innerHTML = `
              <img src="${imgSrc || '../assets/miafeyicon.png'}" alt="${titleText}">
              <h3>${titleText}</h3>
            `;
            grid.appendChild(card);
          }
        });

      } catch (err) {
        console.error(err);
        displayZone.innerHTML = `<div class="status-msg" style="color: #ff4d4d;">Database pipeline adjustment needed. Using secure redirect link format...</div>`;
      }
    }

    document.addEventListener('DOMContentLoaded', renderMangaCatalog);
  </script>

</body>
</html>
