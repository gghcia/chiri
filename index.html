<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chiri Churros!</title>
    <style>
        /* Base Page Configurations */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #2b221a; /* Kept the exact original dark brown baseline background */
            color: #e6dcd3;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated Canvas Context Layer for the Floating Beige Dots */
        #particles-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none; /* Allows clicks to pass through to items below */
        }

        /* Central Content Container */
        .main-container {
            text-align: center;
            width: 90%;
            max-width: 650px;
            z-index: 2;
            transition: all 0.3s ease;
        }

        /* Main Branding Typography */
        .brand-title {
            font-size: 5rem;
            font-weight: 700;
            color: #dfcbb5;
            margin-bottom: 2px;
            letter-spacing: -1px;
        }

        .brand-subtitle {
            font-size: 0.95rem;
            color: #a89685;
            margin-bottom: 30px;
            letter-spacing: 0.5px;
        }

        /* Interactive Search Engine Box */
        .search-box {
            position: relative;
            margin-bottom: 35px;
            width: 100%;
        }

        .search-box input {
            width: 100%;
            padding: 14px 20px;
            background-color: rgba(61, 49, 39, 0.6);
            border: 1px solid rgba(212, 163, 115, 0.2);
            border-radius: 30px;
            color: #f5efe9;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
            text-align: center;
            backdrop-filter: blur(5px);
        }

        .search-box input:focus {
            background-color: rgba(74, 60, 48, 0.8);
            border-color: rgba(212, 163, 115, 0.6);
            box-shadow: 0 0 15px rgba(212, 163, 115, 0.15);
        }

        .search-box input::placeholder {
            color: #8c7b6c;
        }

        /* Application Grid Layout */
        .app-grid {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }

        .app-card {
            background-color: rgba(61, 49, 39, 0.5);
            border: 1px solid rgba(212, 163, 115, 0.1);
            border-radius: 16px;
            width: 76px;
            height: 76px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.25s ease;
            text-decoration: none;
            color: inherit;
            backdrop-filter: blur(5px);
        }

        .app-card:hover {
            background-color: rgba(212, 163, 115, 0.15);
            border-color: rgba(212, 163, 115, 0.4);
            transform: translateY(-3px);
        }

        .app-icon {
            font-size: 22px;
            margin-bottom: 6px;
            color: #d4a373;
        }

        .app-label {
            font-size: 11px;
            color: #c4b4a3;
            font-weight: 500;
        }

        /* Footer Bottom Bar Componentry */
        .bottom-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: flex-end; /* Pushes the clock perfectly to the right side */
            align-items: center;
            padding: 15px 25px;
            font-size: 12px;
            z-index: 2;
        }

        .live-clock {
            color: #a89685;
            font-weight: 500;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <!-- Canvas layer for background dot tracking rendering -->
    <canvas id="particles-canvas"></canvas>

    <!-- Primary Dashboard Workstation Area -->
    <div class="main-container" id="mainDashboard">
        <div class="brand-title">chiri</div>
        <div class="brand-subtitle">mia fey.... mia fey... </div>

        <!-- System Search Engine Portal -->
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="search or enter url..." autocomplete="off">
        </div>

        <!-- App links -->
        <div class="app-grid">
            <a href="games/study.html" class="app-card">
                <div class="app-icon">📚</div>
                <div class="app-label">study</div>
            </a>
            <a href="games/movies.html" class="app-card">
                <div class="app-icon">🎬</div>
                <div class="app-label">movies</div>
            </a>
            <a href="games/anime.html" class="app-card">
                <div class="app-icon">🎌</div>
                <div class="app-label">anime</div>
            </a>
            <a href="games/music.html" class="app-card">
                <div class="app-icon">🎵</div>
                <div class="app-label">music</div>
            </a>
            <a href="https://www.tiktok.com" class="app-card" target="_blank" rel="noopener noreferrer">
                <div class="app-icon">🎵</div>
                <div class="app-label">tiktok</div>
            </a>
            <a href="games/all.html" class="app-card">
                <div class="app-icon">⣿</div>
                <div class="app-label">all apps</div>
            </a>
        </div>
    </div>

    <!-- Footer System Status & Controls -->
    <div class="bottom-bar">
        <div class="live-clock" id="clockDisplay">00:00:00 PM</div>
    </div>

    <!-- System Real-Time Data Scripts & Dynamic Particle Engine -->
    <script>
        // System Clock Functionality
        function updateSystemClock() {
            const timeOptions = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };
            document.getElementById('clockDisplay').textContent = new Date().toLocaleTimeString('en-US', timeOptions);
        }
        setInterval(updateSystemClock, 1000);
        updateSystemClock();

        const searchInput = document.getElementById('searchInput');
        const appRoutes = {
            study: 'games/study.html',
            movies: 'games/movies.html',
            anime: 'games/anime.html',
            music: 'games/music.html',
            tiktok: 'https://www.tiktok.com',
            'all apps': 'games/all.html',
            all: 'games/all.html'
        };

        searchInput.addEventListener('keydown', (event) => {
            if (event.key !== 'Enter') return;

            const query = searchInput.value.trim();
            if (!query) return;

            const route = appRoutes[query.toLowerCase()];
            if (route) {
                window.location.href = route;
            } else if (/^https?:\/\//i.test(query)) {
                window.location.href = query;
            } else {
                window.location.href = 'games/all.html?query=' + encodeURIComponent(query);
            }
        });

        // Canvas particle animation
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');
        let particlesArray = [];
        const numberOfParticles = 45;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 1;
                this.speedX = Math.random() * 0.3 - 0.15;
                this.speedY = Math.random() * 0.3 - 0.15;
                this.opacity = Math.random() * 0.4 + 0.2;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.x > canvas.width) this.x = 0;
                else if (this.x < 0) this.x = canvas.width;
                if (this.y > canvas.height) this.y = 0;
                else if (this.y < 0) this.y = canvas.height;
            }
            draw() {
                ctx.fillStyle = `rgba(223, 203, 181, ${this.opacity})`; // Warm beige particle color engine match
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            particlesArray = [];
            for (let i = 0; i < numberOfParticles; i++) {
                particlesArray.push(new Particle());
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particlesArray.forEach((particle) => {
                particle.update();
                particle.draw();
            });
            requestAnimationFrame(animateParticles);
        }

        window.addEventListener('resize', () => {
            resizeCanvas();
            initParticles();
        });

        resizeCanvas();
        initParticles();
        animateParticles();
    </script>
</body>
</html>
