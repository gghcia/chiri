<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chiri</title>
    <link rel="icon" type="image/png" href="assets/miafeyicon.png">


    <style>
        /* Base Page Configurations */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #2b221a; /* Kept the exact original dark brown baseline background */
            color: #e6dcd3;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated Canvas Context Layer for the Floating Beige Dots */
        #particles-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none; /* Allows clicks to pass through to items below */
        }

        /* Central Content Container */
        .main-container {
            text-align: center;
            width: 90%;
            max-width: 650px;
            z-index: 2;
            transition: all 0.3s ease;
        }

        /* Main Branding Typography */
        .brand-title {
            font-size: 5rem;
            font-weight: 700;
            color: #dfcbb5;
            margin-bottom: 2px;
            letter-spacing: -1px;
        }

        .brand-subtitle {
            font-size: 0.95rem;
            color: #a89685;
            margin-bottom: 30px;
            letter-spacing: 0.5px;
        }

        /* Interactive Search Engine Box */
        .search-box {
            position: relative;
            margin-bottom: 35px;
            width: 100%;
        }

        .search-box input {
            width: 100%;
            padding: 14px 20px;
            background-color: rgba(61, 49, 39, 0.6);
            border: 1px solid rgba(212, 163, 115, 0.2);
            border-radius: 30px;
            color: #f5efe9;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
            text-align: center;
            backdrop-filter: blur(5px);
        }

        .search-box input:focus {
            background-color: rgba(74, 60, 48, 0.8);
            border-color: rgba(212, 163, 115, 0.6);
            box-shadow: 0 0 15px rgba(212, 163, 115, 0.15);
        }

        .search-box input::placeholder {
            color: #8c7b6c;
        }

        /* Application Grid Layout */
        .app-grid {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }

        .app-card {
            background-color: rgba(61, 49, 39, 0.5);
            border: 1px solid rgba(212, 163, 115, 0.1);
            border-radius: 16px;
            width: 76px;
            height: 76px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.25s ease;
            text-decoration: none;
            color: inherit;
            backdrop-filter: blur(5px);
        }

        .app-card:hover {
            background-color: rgba(212, 163, 115, 0.15);
            border-color: rgba(212, 163, 115, 0.4);
            transform: translateY(-3px);
        }

        .app-icon {
            font-size: 22px;
            margin-bottom: 6px;
            color: #d4a373;
        }

        .app-card:nth-child(5) .app-icon {
             color: #f0d9ad; /* Cool color shift for TikTok element */
        }

        .app-label {
            font-size: 11px;
            color: #c4b4a3;
            font-weight: 500;
        }

        /* --- Full Screen Web Proxy Viewport --- */
        .proxy-viewport-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #171717; /* Sleek dark theme matching unblocked engines */
            display: none;
            flex-direction: column;
            z-index: 100;
        }

        /* Top address navigator bar */
        .viewport-header {
            background: #202124;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            border-bottom: 1px solid #3c4043;
        }

        .nav-controls {
            display: flex;
            gap: 8px;
        }

        .nav-btn {
            background: transparent;
            border: none;
            color: #e8eaed;
            font-size: 16px;
            cursor: pointer;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .address-bar {
            flex: 1;
            background: #303134;
            border: 1px solid #3c4043;
            border-radius: 20px;
            padding: 6px 18px;
            color: #e8eaed;
            font-size: 14px;
            display: flex;
            align-items: center;
        }

        .address-bar span {
            color: #9aa0a6;
            margin-right: 4px;
            user-select: none;
        }

        .address-bar input {
            background: transparent;
            border: none;
            outline: none;
            color: #e8eaed;
            width: 100%;
            font-size: 14px;
        }

        .close-viewport-btn {
            background: #ea4335;
            color: white;
            border: none;
            padding: 6px 16px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .close-viewport-btn:hover {
            background: #c5372b;
        }

        #proxy-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
        }

        /* Footer Bottom Bar Componentry */
        .bottom-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: flex-end; /* Pushes clock to right */
            align-items: center;
            padding: 15px 25px;
            font-size: 12px;
            z-index: 2;
        }

        .live-clock {
            color: #a89685;
            font-weight: 500;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <!-- Canvas layer for background dot tracking rendering -->
    <canvas id="particles-canvas"></canvas>

    <!-- Primary Dashboard Workstation Area -->
    <div class="main-container" id="mainDashboard">
        <div class="brand-title">ana</div>
        <div class="brand-subtitle">OBESE MILES EDGEWORTH</div>

        <!-- System Search Engine Portal -->
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="BOIIII TS DONT FUCKIN WORK YET" autocomplete="off">
        </div>

        <!-- App links -->
        <div class="app-grid">
            <a href="games/study.html" class="app-card">
                <div class="app-icon">📚</div>
                <div class="app-label">study</div>
            </a>
            <a href="games/movies.html" class="app-card">
                <div class="app-icon">🎬</div>
                <div class="app-label">movies</div>
            </a>
            <a href="games/anime.html" class="app-card">
                <div class="app-icon">🎌</div>
                <div class="app-label">anime</div>
            </a>
              <a href="games/manga.html" class="app-card">
                <div class="app-icon">📖</div>
                <div class="app-label">manga</div>
            </a>
            <a href="games/music.html" class="app-card">
                <div class="app-icon">🎵</div>
                <div class="app-label">music</div>
            </a>
            </a>
            <a href="games/all.html" class="app-card">
                <div class="app-icon">⣿</div>
                <div class="app-label">all apps</div>
            </a>
        </div>
    </div>

    <!-- Full Browser Layout Proxy Frame Panel -->
    <div class="proxy-viewport-container" id="viewportWindow">
        <div class="viewport-header">
            <div class="nav-controls">
                <button class="nav-btn" id="backButton" type="button" title="Back" aria-label="Back">⟵</button>
                <button class="nav-btn" id="forwardButton" type="button" title="Forward" aria-label="Forward">⟶</button>
                <button class="nav-btn" id="refreshButton" type="button" title="Reload" aria-label="Reload">⟳</button>
            </div>
            <div class="address-bar">
                <span>🔒 chiri://</span>
                <input type="text" id="viewportAddressBar" value="">
            </div>
            <button class="close-viewport-btn" onclick="closeViewport()">Exit Proxy</button>
        </div>
        <iframe id="proxy-frame" src="about:blank"></iframe>
    </div>

    <!-- Footer System Status & Controls -->
    <div class="bottom-bar">
        <div class="live-clock" id="clockDisplay">00:00:00 PM</div>
    </div>

    <!-- System Real-Time Data Scripts & Dynamic Particle Engine -->
    <script>
        // System Clock Functionality
        function updateSystemClock() {
            const timeOptions = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };
            document.getElementById('clockDisplay').textContent = new Date().toLocaleTimeString('en-US', timeOptions);
        }

        setInterval(updateSystemClock, 1000);
        updateSystemClock();

        const searchInput = document.getElementById('searchInput');
        const mainDashboard = document.getElementById('mainDashboard');
        const viewportWindow = document.getElementById('viewportWindow');
        const proxyFrame = document.getElementById('proxy-frame');
        const viewportAddressBar = document.getElementById('viewportAddressBar');
        const appRoutes = {
            study: 'games/study.html',
            movies: 'games/movies.html',
            anime: 'games/anime.html',
            music: 'games/music.html',
            'all apps': 'games/all.html',
            all: 'games/all.html'
        };

        let pageHistory = [];
        let historyIndex = -1;

        function getDestination(query) {
            const trimmedQuery = query.trim();
            const route = appRoutes[trimmedQuery.toLowerCase()];
            if (route) return route;
            if (/^https?:\/\//i.test(trimmedQuery)) return trimmedQuery;
            if (/^[\w-]+(\.[\w-]+)+(?::\d+)?(?:\/.*)?$/.test(trimmedQuery)) {
                return `https://${trimmedQuery}`;
            }
            return `https://www.google.com/search?q=${encodeURIComponent(trimmedQuery)}`;
        }

        function updateHistoryButtons() {
            document.getElementById('backButton').disabled = historyIndex <= 0;
            document.getElementById('forwardButton').disabled = historyIndex >= pageHistory.length - 1;
        }

        function showPage(destination, addToHistory = true) {
            if (destination.startsWith('games/')) {
                window.location.href = destination;
                return;
            }

            if (addToHistory) {
                pageHistory = pageHistory.slice(0, historyIndex + 1);
                pageHistory.push(destination);
                historyIndex = pageHistory.length - 1;
            }

            proxyFrame.src = destination;
            viewportAddressBar.value = destination;
            mainDashboard.style.display = 'none';
            viewportWindow.style.display = 'flex';
            updateHistoryButtons();
        }

        searchInput.addEventListener('keydown', (event) => {
            if (event.key !== 'Enter' || !searchInput.value.trim()) return;
            showPage(getDestination(searchInput.value));
        });

        viewportAddressBar.addEventListener('keydown', (event) => {
            if (event.key !== 'Enter' || !viewportAddressBar.value.trim()) return;
            showPage(getDestination(viewportAddressBar.value));
        });

        document.getElementById('backButton').addEventListener('click', () => {
            if (historyIndex <= 0) return;
            historyIndex -= 1;
            showPage(pageHistory[historyIndex], false);
        });

        document.getElementById('forwardButton').addEventListener('click', () => {
            if (historyIndex >= pageHistory.length - 1) return;
            historyIndex += 1;
            showPage(pageHistory[historyIndex], false);
        });

        document.getElementById('refreshButton').addEventListener('click', () => {
            if (historyIndex >= 0) proxyFrame.src = pageHistory[historyIndex];
        });

        function closeViewport() {
            proxyFrame.src = 'about:blank';
            viewportWindow.style.display = 'none';
            mainDashboard.style.display = '';
            searchInput.focus();
        }

        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');
        let particlesArray = [];
        const numberOfParticles = 45;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 3 + 1;
                this.speedX = Math.random() * 0.4 - 0.2;
                this.speedY = Math.random() * 0.4 - 0.2;
                this.alpha = Math.random() * 0.4 + 0.1;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x > canvas.width) this.x = 0;
                if (this.x < 0) this.x = canvas.width;
                if (this.y > canvas.height) this.y = 0;
                if (this.y < 0) this.y = canvas.height;
            }

            draw() {
                ctx.fillStyle = `rgba(212, 163, 115, ${this.alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            particlesArray = Array.from({ length: numberOfParticles }, () => new Particle());
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particlesArray.forEach((particle) => {
                particle.update();
                particle.draw();
            });
            requestAnimationFrame(animateParticles);
        }

        resizeCanvas();
        initParticles();
        animateParticles();
        window.addEventListener('resize', () => {
            resizeCanvas();
            initParticles();
        });
    </script>
</body>
</html>
